<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a1124"><title>Reset Password | Eventide SL</title>
<style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#402752,#17101f 65%);color:#f6edf9;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);padding:32px;border:1px solid #745785;border-radius:18px;background:#261a30;box-shadow:0 16px 50px #0005}h1{margin:0 0 10px;font-size:28px}p{line-height:1.5;color:#d7c7de}label{display:block;margin:22px 0 8px;font-weight:600}input{width:100%;padding:13px;border:1px solid #947ca3;border-radius:9px;background:#160f1d;color:white;font:inherit}button{width:100%;margin-top:18px;border:0;border-radius:9px;background:#edc88c;color:#25172e;padding:13px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#f2d3a0}#message{min-height:24px}#message.error{color:#ffbcbc}#message.success{color:#aaf1cb}form[hidden]{display:none}</style></head>
<body><main><h1>Reset your password</h1><p>Choose a new password for your Eventide SL account.</p><form id="reset-form" hidden><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button id="save" type="submit">Save new password</button></form><p id="message" role="status" aria-live="polite">Checking your reset link...</p><p><a href="./dashboard.html">Back to Club Dashboard</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./supabase-config.js"></script><script>
'use strict';
const message=document.getElementById('message'),form=document.getElementById('reset-form');
function show(text,kind=''){message.textContent=text;message.className=kind;}
(async()=>{
 if(!window.supabase||!window.EVENTIDE_SUPABASE_URL||!window.EVENTIDE_SUPABASE_ANON_KEY){show('Password recovery is not configured.','error');return;}
 const db=window.supabase.createClient(window.EVENTIDE_SUPABASE_URL,window.EVENTIDE_SUPABASE_ANON_KEY,{auth:{detectSessionInUrl:false,persistSession:true}});
 try{
   const query=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1));
   if(query.get('error')||fragment.get('error'))throw Error(query.get('error_description')||fragment.get('error_description')||'This reset link is invalid or expired.');
   if(query.has('token_hash')){
     const {error}=await db.auth.verifyOtp({token_hash:query.get('token_hash'),type:'recovery'});
     if(error)throw error;
   }else if(query.has('code')){
     const {error}=await db.auth.exchangeCodeForSession(query.get('code'));
     if(error)throw error;
   }else if(fragment.has('access_token')&&fragment.has('refresh_token')){
     if(fragment.get('type')&&fragment.get('type')!=='recovery')throw Error('This is not a password reset link.');
     const {error}=await db.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
     if(error)throw error;
   }
   const {data,error}=await db.auth.getSession();
   if(error)throw error;
   if(!data.session)throw Error('The reset link is invalid or expired. Request a fresh link from the dashboard.');
   history.replaceState(null,'',location.pathname);
   form.hidden=false;show('Enter your new password.');
   form.addEventListener('submit',async event=>{
     event.preventDefault();
     const password=document.getElementById('new-password').value,confirm=document.getElementById('confirm-password').value;
     if(password.length<8){show('Use at least 8 characters.','error');return;}
     if(password!==confirm){show('The passwords do not match.','error');return;}
     const save=document.getElementById('save');save.disabled=true;
     try{
       const {error}=await db.auth.updateUser({password});
       if(error)throw error;
       form.hidden=true;
       await db.auth.signOut();
       show('Your password has been updated. You can now sign in from the Club Dashboard.','success');
     }catch(error){show(error.message||'Password update failed.','error');save.disabled=false;}
   });
 }catch(error){show(error.message||'Could not verify your reset link.','error');}
})();
</script></body></html>
