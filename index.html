<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SL Events Explorer</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#0b1020;color:#eaf0ff}header{background:linear-gradient(110deg,#182957,#291a45);padding:38px max(22px,calc((100vw - 1050px)/2))}h1{font-size:clamp(30px,5vw,52px);margin:0}header p{color:#b7c8e9}main{max-width:1050px;margin:auto;padding:24px}nav,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,input,select{border:1px solid #384765;background:#17233b;color:#fff;padding:12px;border-radius:10px;font:inherit}button{cursor:pointer}button.active{background:#7366f4;border-color:#7366f4}input{flex:1;min-width:190px}.stats{color:#a8b9d6}#events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.event{background:#151e32;border:1px solid #2c3852;border-radius:14px;padding:18px}.event h3{margin:10px 0}.tag{font-size:12px;color:#b7adff;text-transform:uppercase;letter-spacing:.08em}.meta{color:#afbdd7;font-size:14px}a{color:#9db7ff}.pill{display:inline-block;background:#27385a;border-radius:20px;padding:5px 9px}#notice{padding:13px;background:#202c43;border-radius:9px;margin:18px 0}footer{color:#99a8c2;text-align:center;padding:32px}</style></head><body><header><h1>SL Events Explorer</h1><p>Discover upcoming events across Second Life. Independent community project.</p></header><main><nav><button class="active" data-view="all">All Events</button><button data-view="music">Live Music</button></nav><div class="controls"><input id="search" placeholder="Search events, artists or venues" aria-label="Search events"><select id="category" aria-label="Category"><option value="all">All categories</option></select><select id="date" aria-label="Date"><option value="all">Any date</option><option value="today">Today</option><option value="tomorrow">Tomorrow</option><option value="week">Next 7 days</option></select><select id="sort" aria-label="Sort"><option value="asc">Soonest first</option><option value="desc">Latest first</option></select></div><p id="notice" role="status">Loading events…</p><p class="stats" id="count"></p><section id="events"></section></main><footer>Not affiliated with Linden Lab or Second Life. Event details are supplied by their original publishers. <a href="https://secondlife.com/events/">Official events calendar</a>.</footer><script>
let events=[],view='all';const $=id=>document.getElementById(id);const music=/\b(music|live singer|singing|concert|pianist|piano|dj|disc jockey|band|jazz|blues|rock|classical|karaoke|gig|performer|musician)\b/i;const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeUrl=u=>{try{const x=new URL(u);return ['https:','http:','secondlife:'].includes(x.protocol)?x.href:null}catch{return null}};
function render(){let now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),tomorrow=new Date(start.getTime()+86400000),after=new Date(tomorrow.getTime()+86400000),week=new Date(start.getTime()+7*86400000);let q=$('search').value.toLowerCase(),cat=$('category').value,d=$('date').value;let filtered=events.filter(e=>{let t=new Date(e.starts_at);return (!q||[e.title,e.venue,e.description,e.category].join(' ').toLowerCase().includes(q))&&(cat==='all'||e.category===cat)&&(view!=='music'||music.test([e.title,e.description,e.category].join(' ')))&&(d==='all'||d==='today'&&t>=start&&t<tomorrow||d==='tomorrow'&&t>=tomorrow&&t<after||d==='week'&&t>=start&&t<week)}).sort((a,b)=>($('sort').value==='asc'?1:-1)*(new Date(a.starts_at)-new Date(b.starts_at)));$('count').textContent=`${filtered.length} event${filtered.length===1?'':'s'} shown`; $('events').innerHTML=filtered.map(e=>{let url=safeUrl(e.url),tp=safeUrl(e.teleport_url);return `<article class="event"><span class="tag">${escape(e.category||'Other')}</span><h3>${escape(e.title)}</h3><p class="meta">${escape(new Date(e.starts_at).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}))} · Local time</p><p class="meta">${escape(e.venue||'Venue not specified')}</p>${e.description?`<p>${escape(e.description).slice(0,300)}</p>`:''}${url?`<a href="${escape(url)}" target="_blank" rel="noopener noreferrer">Event details</a>`:''}${tp?` · <a href="${escape(tp)}" target="_blank" rel="noopener noreferrer">Teleport</a>`:''}</article>`}).join('')||'<p>No matching events available.</p>'}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()};for(const id of ['search','category','date','sort'])$(id).addEventListener(id==='search'?'input':'change',render);
fetch('./data/events.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No events feed');return r.json()}).then(data=>{events=(Array.isArray(data.events)?data.events:[]).filter(e=>e.title&&e.starts_at&&!Number.isNaN(new Date(e.starts_at).getTime())&&new Date(e.starts_at)>new Date(Date.now()-3600000));let categories=[...new Set(events.map(e=>e.category).filter(Boolean))].sort();for(let c of categories){let o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)}$('notice').textContent=data.status==='ok'?`Source: Second Life events calendar · Last sync: ${data.updated_at||'unknown'} · Times shown in your local timezone.`:`Live sync unavailable: ${data.message||'No verified events retrieved'}. No demonstration events are shown.`;render()}).catch(e=>{$('notice').textContent='Unable to load event data. The site is online but its event feed is not yet available.';$('count').textContent='0 events';$('events').innerHTML=''})
</script></body></html>
