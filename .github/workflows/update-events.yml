
name: Update Second Life events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install beautifulsoup4 playwright requests
          python -m playwright install --with-deps chromium

      - name: Collect events
        env:
          SL_USERNAME: ${{ secrets.SL_USERNAME }}
          SL_PASSWORD: ${{ secrets.SL_PASSWORD }}
        run: python sync_events.py

      - name: Commit feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update SL events feed'
            git push
          fi
