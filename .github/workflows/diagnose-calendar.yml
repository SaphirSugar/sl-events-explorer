name: Diagnose Second Life calendar
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python probe_calendar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-diagnostic
          path: calendar_diagnostic.json
